<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="256" height="256">
  <!-- Cortado © 2026 SilverneoStar (SilverStarneo-Cortado). CC BY-NC-ND 4.0: https://creativecommons.org/licenses/by-nc-nd/4.0/ -->
  <defs>
    <radialGradient id="shell" cx="36%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#FFF9F0"/>
      <stop offset="55%" stop-color="#EBDAC2"/>
      <stop offset="100%" stop-color="#B8926E"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3A271D"/>
      <stop offset="100%" stop-color="#1F140E"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F6C25A"/>
      <stop offset="100%" stop-color="#D9952A"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#D5DBE3"/>
      <stop offset="100%" stop-color="#8E98A6"/>
    </linearGradient>
    <filter id="eyeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="32" cy="60" rx="12" ry="2.6" fill="#000" opacity="0.18"/>

  <!-- Arms -->
  <path d="M15 38 Q9 40 8.5 45" stroke="#2B1D16" stroke-width="4.6" fill="none" stroke-linecap="round"/>
  <path d="M15 38 Q9 40 8.5 45" stroke="#9C7255" stroke-width="2.6" fill="none" stroke-linecap="round"/>
  <path d="M49 38 Q55 40 55.5 45" stroke="#2B1D16" stroke-width="4.6" fill="none" stroke-linecap="round"/>
  <path d="M49 38 Q55 40 55.5 45" stroke="#9C7255" stroke-width="2.6" fill="none" stroke-linecap="round"/>

  <!-- Stitched rings on the arms -->
  <path d="M12.02 40.93 L10.45 38.98" stroke="#5A3E2E" stroke-width="0.55" stroke-dasharray="0.6 0.45" stroke-linecap="round"/>
  <path d="M10.55 42.59 L8.40 41.31" stroke="#5A3E2E" stroke-width="0.55" stroke-dasharray="0.6 0.45" stroke-linecap="round"/>
  <path d="M53.55 38.98 L51.98 40.93" stroke="#5A3E2E" stroke-width="0.55" stroke-dasharray="0.6 0.45" stroke-linecap="round"/>
  <path d="M55.60 41.31 L53.45 42.59" stroke="#5A3E2E" stroke-width="0.55" stroke-dasharray="0.6 0.45" stroke-linecap="round"/>

  <!-- Mitts -->
  <circle cx="8.5" cy="47.5" r="3.4" fill="#EBDAC2" stroke="#2B1D16" stroke-width="1.2"/>
  <circle cx="55.5" cy="47.5" r="3.4" fill="#EBDAC2" stroke="#2B1D16" stroke-width="1.2"/>
  <path d="M6.6 48.8 Q8.5 50.6 10.4 48.8" stroke="#B8926E" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M53.6 48.8 Q55.5 50.6 57.4 48.8" stroke="#B8926E" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- Otter ears (behind the body) -->
  <circle cx="14.6" cy="26.5" r="4.4" fill="#D9C2A2" stroke="#2B1D16" stroke-width="1.3"/>
  <circle cx="14.9" cy="26.8" r="2.2" fill="#9C7255"/>
  <circle cx="49.4" cy="26.5" r="4.4" fill="#D9C2A2" stroke="#2B1D16" stroke-width="1.3"/>
  <circle cx="49.1" cy="26.8" r="2.2" fill="#9C7255"/>

  <!-- Body -->
  <circle cx="32" cy="36" r="19" fill="url(#shell)" stroke="#2B1D16" stroke-width="1.6"/>
  <!-- Lower shading -->
  <path d="M14.5 42 Q32 58 49.5 42 Q48 52 32 55 Q16 52 14.5 42 Z" fill="#8F6A4E" opacity="0.25"/>
  <!-- Stitched seam -->
  <path d="M14.2 40.6 Q32 47.2 49.8 40.6" stroke="#6B4A36" stroke-width="0.8" fill="none" stroke-dasharray="1.4 1.2"/>

  <!-- Hi-vis band -->
  <path d="M15.6 46 Q32 52 48.4 46 L46.6 49.8 Q32 55.2 17.4 49.8 Z" fill="#E8833A" stroke="#2B1D16" stroke-width="1"/>
  <!-- Float belt: its own inflatable layer (stitched air chambers, reflective strip, valve) -->
  <path d="M21 47.7 L21 51 M26.5 48.7 L26.5 52.1 M37.5 48.7 L37.5 52.1 M43 47.7 L43 51" stroke="#B4561C" stroke-width="0.5" stroke-linecap="round"/>
  <path d="M16.8 47.9 Q32 53.4 47.2 47.9" stroke="#2B1D16" stroke-width="1.5" fill="none"/>
  <path d="M16.8 47.9 Q32 53.4 47.2 47.9" stroke="#E6EBF0" stroke-width="0.8" fill="none"/>
  <circle cx="32" cy="50.6" r="1.5" fill="url(#silver)" stroke="#2B1D16" stroke-width="0.6"/>
  <circle cx="32" cy="50.6" r="0.55" fill="#5A4334"/>
  <!-- Little bolt badges -->
  <circle cx="16.8" cy="35" r="1.4" fill="#CFC2B4" stroke="#2B1D16" stroke-width="0.7"/>
  <path d="M16 35 L17.6 35" stroke="#2B1D16" stroke-width="0.6"/>
  <circle cx="47.2" cy="35" r="1.4" fill="#CFC2B4" stroke="#2B1D16" stroke-width="0.7"/>
  <path d="M47.2 34.2 L47.2 35.8" stroke="#2B1D16" stroke-width="0.6"/>

  <!-- Face screen -->
  <rect x="19.5" y="26.5" width="25" height="14.5" rx="7.2" fill="url(#screen)" stroke="#2B1D16" stroke-width="1.3"/>
  <!-- Unibrow -->
  <path d="M24.2 29.2 Q28 28 32 28.8 Q36 28 39.8 29.2" stroke="#9A8F88" stroke-width="1.1" fill="none" stroke-linecap="round"/>

  <!-- Glowing eyes: soft rounded bars, no pupils -->
  <g filter="url(#eyeGlow)">
    <rect x="24.3" y="30.6" width="5.4" height="6" rx="2.4" fill="#FFE2B0"/>
    <rect x="34.3" y="30.6" width="5.4" height="6" rx="2.4" fill="#FFE2B0"/>
  </g>
  <rect x="24.3" y="30.6" width="5.4" height="6" rx="2.4" fill="none" stroke="#B07D52" stroke-width="1"/>
  <rect x="34.3" y="30.6" width="5.4" height="6" rx="2.4" fill="none" stroke="#B07D52" stroke-width="1"/>
  <rect x="25.3" y="31.4" width="1.6" height="2" rx="0.8" fill="#fff" opacity="0.85"/>
  <rect x="35.3" y="31.4" width="1.6" height="2" rx="0.8" fill="#fff" opacity="0.85"/>
  <!-- Blush lights -->
  <ellipse cx="22.6" cy="38" rx="1.5" ry="0.8" fill="#F4A7A0" opacity="0.8"/>
  <ellipse cx="41.4" cy="38" rx="1.5" ry="0.8" fill="#F4A7A0" opacity="0.8"/>

  <!-- Shine -->
  <path d="M19.5 25 A15 15 0 0 1 26 19.8" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Scuffs -->
  <path d="M45.8 38.4 l1.6 -0.4" stroke="#8F6A4E" stroke-width="0.6" stroke-linecap="round" opacity="0.7"/>

  <!-- Knit beanie -->
  <path d="M19.4 21.5 Q18.6 7.5 32 7.5 Q45.4 7.5 44.6 21.5 Z" fill="#7A4A2A" stroke="#2B1D16" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M24 20.5 Q23.6 11.5 26.6 9.4 M28.6 20.5 Q28.4 10.4 30 8.4 M33.4 20.5 Q33.6 10.4 34.4 8.2" stroke="#5E3720" stroke-width="0.7" fill="none" stroke-linecap="round"/>
  <rect x="17.4" y="18.6" width="29.2" height="5.2" rx="2.4" fill="#9C6440" stroke="#2B1D16" stroke-width="1.1"/>
  <path d="M20 19.6 V22.8 M23 19.6 V22.8 M26 19.6 V22.8 M29 19.6 V22.8 M32 19.6 V22.8 M35 19.6 V22.8 M38 19.6 V22.8 M41 19.6 V22.8 M44 19.6 V22.8" stroke="#7A4A2A" stroke-width="0.6" stroke-linecap="round"/>
  <circle cx="32" cy="6.6" r="2.6" fill="#FFF3DA" stroke="#2B1D16" stroke-width="0.9"/>
  <path d="M22.8 15.5 Q23.4 11.4 26.4 9.8" stroke="#B98663" stroke-width="1.1" fill="none" stroke-linecap="round" opacity="0.9"/>
  <!-- Silver star badge -->
  <polygon points="38.40,10.50 39.18,12.52 41.35,12.64 39.67,14.01 40.22,16.11 38.40,14.93 36.58,16.11 37.13,14.01 35.45,12.64 37.62,12.52" fill="url(#silver)" stroke="#2B1D16" stroke-width="0.7" stroke-linejoin="round"/>
  <path d="M37.70 12.90 L38.40 11.50" stroke="#fff" stroke-width="0.5" stroke-linecap="round" opacity="0.9"/>
  <!-- Antenna -->
  <line x1="41.2" y1="10.2" x2="45.2" y2="4.5" stroke="#2B1D16" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="41.2" y1="10.2" x2="45.2" y2="4.5" stroke="#9C7255" stroke-width="0.8" stroke-linecap="round"/>
  <circle cx="45.2" cy="4.5" r="1.6" fill="#FFE2B0" stroke="#2B1D16" stroke-width="0.7"/>
</svg>
